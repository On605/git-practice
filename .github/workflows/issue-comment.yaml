name: Issue Create on Push
on: push
permissions:
  issues: write
jobs:
  create-issue:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      COMMIT_SHA: ${{ github.sha }}
      COMMIT_MSG: ${{ github.event.head_commit.message }}
      ACTOR: ${{ github.actor }}

    steps:
      # 1. GitHub CLI 사용
      - name: Create issue with GitHub CLI
        run: |
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues" \
            -f title="New push by $ACTOR (${COMMIT_SHA:0:7})" \
            -f body="Commit message: $COMMIT_MSG" \
            --jq '.html_url'

      # 2. curl 사용
      - name: Create issue with curl
        run: |
          BODY=$(jq -n \
            --arg title "New push by $ACTOR (${COMMIT_SHA:0:7})" \
            --arg body "Commit message: $COMMIT_MSG" \
            '{title: $title, body: $body}')
          curl -L --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues" \
            -d "$BODY"